<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SVG vs Canvas bench</title>
<style>body{font:14px system-ui;margin:16px}#stage{width:800px;height:400px;position:relative}#stage>*{position:absolute;inset:0}</style>
</head><body>
<div id="stage"></div>
<pre id="out">running…</pre>
<script>
const W = 800, H = 400;
const stage = document.getElementById('stage');
const frames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
function data(n) { const a = new Float64Array(n); let v = 200; for (let i = 0; i < n; i++) { v += Math.sin(i * 0.37) * 4 + ((i * 7919) % 13 - 6); a[i] = Math.max(5, Math.min(H - 5, v)); } return a; }
const NS = 'http://www.w3.org/2000/svg';
const kinds = {
  'svg-marks': (d) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`); const n = d.length; for (let i = 0; i < n; i++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', (i / n * W).toFixed(1)); c.setAttribute('cy', d[i].toFixed(1)); c.setAttribute('r', '2'); c.setAttribute('fill', 'steelblue'); s.appendChild(c); } return s; },
  'svg-path': (d) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`); const n = d.length; let p = ''; for (let i = 0; i < n; i++) p += (i ? 'L' : 'M') + (i / n * W).toFixed(1) + ' ' + d[i].toFixed(1); const e = document.createElementNS(NS, 'path'); e.setAttribute('d', p); e.setAttribute('fill', 'none'); e.setAttribute('stroke', 'steelblue'); e.setAttribute('stroke-width', '2'); s.appendChild(e); return s; },
  'canvas-marks': (d) => { const c = document.createElement('canvas'); const r = devicePixelRatio || 1; c.width = W * r; c.height = H * r; c.style.width = W + 'px'; const x = c.getContext('2d'); x.scale(r, r); x.fillStyle = 'steelblue'; const n = d.length; for (let i = 0; i < n; i++) { x.beginPath(); x.arc(i / n * W, d[i], 2, 0, 6.2832); x.fill(); } return c; },
  'canvas-path': (d) => { const c = document.createElement('canvas'); const r = devicePixelRatio || 1; c.width = W * r; c.height = H * r; c.style.width = W + 'px'; const x = c.getContext('2d'); x.scale(r, r); x.strokeStyle = 'steelblue'; x.lineWidth = 2; x.beginPath(); const n = d.length; for (let i = 0; i < n; i++) { const X = i / n * W; i ? x.lineTo(X, d[i]) : x.moveTo(X, d[i]); } x.stroke(); return c; },
};
async function measure(kind, n) {
  const d = data(n); const ts = [], ss = [];
  for (let k = 0; k < 5; k++) { stage.replaceChildren(); await frames(); const t0 = performance.now(); const el = kinds[kind](d); stage.appendChild(el); stage.getBoundingClientRect(); if (el.getBBox) el.getBBox(); ss.push(performance.now() - t0); await frames(); ts.push(performance.now() - t0); }
  ts.sort((a, b) => a - b); ss.sort((a, b) => a - b); return [+ss[2].toFixed(1), +ts[2].toFixed(1)];
}
(async () => {
  const Ns = [100, 500, 1000, 2000, 5000, 10000, 50000, 100000];
  const res = {};
  for (const kind of Object.keys(kinds)) { res[kind] = {}; for (const n of Ns) { if (kind === 'svg-marks' && n > 50000) { res[kind][n] = null; continue; } res[kind][n] = await measure(kind, n); } }
  window.BENCH = { ua: navigator.userAgent, dpr: devicePixelRatio, cores: navigator.hardwareConcurrency, res };
  document.getElementById('out').textContent = JSON.stringify(window.BENCH, null, 1);
})();
</script>
</body></html>
